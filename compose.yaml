name: gestao-publica-lab

services:
  workspace:
    ports:
      - "127.0.0.1:5173:5173"
    build:
      context: .
      dockerfile: docker/workspace/Dockerfile
    env_file:
      - path: ./docker/.env
        required: false
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gestao_publica_lab
      DB_USERNAME: gestao_publica_lab
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    command:
      - sh
      - -c
      - >-
        chown -R vscode:vscode
        /workspaces/gestao-publica-lab/vendor
        /workspaces/gestao-publica-lab/node_modules
        /home/vscode/.local/share/pnpm
        && exec php-fpm
    volumes:
      - .:/workspaces/gestao-publica-lab
      - vendor:/workspaces/gestao-publica-lab/vendor
      - node_modules:/workspaces/gestao-publica-lab/node_modules
      - pnpm_store:/home/vscode/.local/share/pnpm/store
    networks:
      - application
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null && php-fpm -t >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.29.8-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/workspaces/gestao-publica-lab:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application
    depends_on:
      workspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.4-trixie
    env_file:
      - path: ./docker/.env
        required: false
    environment:
      POSTGRES_DB: gestao_publica_lab
      POSTGRES_USER: gestao_publica_lab
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks:
      - application
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  application:
    driver: bridge

volumes:
  vendor:
  node_modules:
  pnpm_store:
  postgres_data:
  valkey_data:
